<!doctype html>
<html lang="fa" dir="rtl" data-season="autumn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقویم شمسی</title>
<meta name="description" content="Persian (Shamsi) calendar with Gregorian dates, countdowns and English mode. Works offline.">
<meta name="theme-color" content="#efeae3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="تقویم">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/vazirmatn.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/baloo.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>
// Apply saved language/theme before first paint to avoid a flash.
try {
  const p = JSON.parse(localStorage.getItem('shamsi.prefs.v1') || '{}');
  const lang = p.lang === 'en' ? 'en' : 'fa';
  const dark = p.appearance === 'dark' || ((p.appearance || 'system') === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
} catch (e) {}
</script>
</head>
<body>
<div id="app" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:system-ui">This calendar needs JavaScript. / این تقویم به جاوااسکریپت نیاز دارد.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
